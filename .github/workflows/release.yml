# Cuts a release of the connector: works out the next version, writes it into every
# module, commits and tags that, builds the zip a partner uploads to their WHMCS, and
# publishes it as a GitHub release.
#
# Triggered by hand (Actions -> Release -> Run workflow, or `_publish.ps1`).
# Nothing is released on push — a release is always a deliberate act.
#
# Where the version comes from:
#   ./VERSION in the repo is the source of truth, and this workflow is the only thing
#   that edits it. Nobody bumps it on their machine, so two people releasing at once
#   cannot pick the same number: the `concurrency` group serialises the runs, and the
#   second one checks out the branch AFTER the first has pushed its bump commit, so it
#   reads the already-incremented VERSION and moves on from there.
#
#   The version is not derived from the git tag, deliberately. For a WHMCS module the
#   number in the files is functional, not decoration: WHMCS compares the addon's
#   _config() version against tbladdonmodules to decide whether to run _upgrade() on a
#   partner's install. It has to be correct in the committed source, at the commit it
#   describes — a tag cannot carry it into the zip. The tag mirrors VERSION; it never
#   defines it.
name: Release

run-name: >-
  ${{ inputs.republish && 'Republish' || 'Release' }}
  ${{ inputs.version != '' && inputs.version || (inputs.republish && 'the current version' || format('({0} bump)', inputs.bump)) }}
  ${{ inputs.draft && '[draft]' || '' }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of ./VERSION to increment before releasing. 'none' releases it as committed. minor/major are your call — nothing can infer them from the diff."
        required: true
        default: patch
        type: choice
        options: [patch, minor, major, none]
      version:
        description: "Exact version to release (MAJOR.MINOR.PATCH[-prerelease]). Overrides 'bump'. Leave empty unless you need a specific number."
        required: false
        type: string
      republish:
        description: "Rebuild and replace an already-published release, keeping its version. Ignores 'bump'. Only allowed when the tag already points at the commit being released."
        required: false
        type: boolean
        default: false
      draft:
        description: "Publish as a draft — the release is created but stays invisible until you press Publish."
        required: false
        type: boolean
        default: false
      prerelease:
        description: "Mark the release as a pre-release (not offered to partners as 'latest')."
        required: false
        type: boolean
        default: false

# Only what this workflow actually needs: push the bump commit + tag, create the release.
permissions:
  contents: write

# Serialising releases is what makes bumping in CI safe: a second run does not start —
# and so does not read ./VERSION — until the first has pushed its bump commit.
# Queued, never cancelled: a cancelled release is a half-done one.
concurrency:
  group: release
  cancel-in-progress: false

env:
  MODULE: vpnhoodpartner

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          # Full history + tags: the release version is worked out from what has
          # already shipped, and the bump commit is pushed back to the branch.
          fetch-depth: 0

      - name: Refuse to release from anything but a branch
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" != "branch" ]; then
            echo "::error::the version bump has to be committed somewhere — run this from a branch, not ${{ github.ref_type }} ${{ github.ref_name }}"
            exit 1
          fi

      # Up front, not next to the commit: the annotated tag needs a tagger too, and a
      # release whose version is already correct skips the commit entirely.
      - name: Configure the committer identity
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Work out the next version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          BUMP: ${{ inputs.bump }}
          REPUBLISH: ${{ inputs.republish }}
          # SemVer with an optional pre-release tail (1.5.0-rc.1). No build metadata:
          # PHP's version_compare() cannot order it, and that is what WHMCS uses to
          # decide whether to run the addon's _upgrade() routine on a partner's install.
          SEMVER: '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
        run: |
          set -euo pipefail

          # Refuse to build on a repo that is already inconsistent — a module left
          # behind at an older number would ship the wrong version to partners.
          bash scripts/set-version.sh --check

          DECLARED="$(tr -d ' \t\r\n' < VERSION)"

          # Re-read the tags now the concurrency gate has let this run in, so a release
          # that finished while this one was queued is accounted for.
          git fetch --tags --force --quiet origin
          LATEST="$(git tag --list 'v*' --sort=-v:refname | head -n1)"

          if [ -n "$INPUT_VERSION" ]; then
            NEXT="$INPUT_VERSION"
            BASIS="explicit input"
          elif [ "$REPUBLISH" = "true" ]; then
            # Republishing is by definition not a new version.
            NEXT="$DECLARED"
            BASIS="./VERSION — republishing"
          elif [ -z "$LATEST" ]; then
            # Nothing has ever shipped, so there is nothing to bump from: the first
            # release is the number the repo already declares.
            NEXT="$DECLARED"
            BASIS="./VERSION — first release, nothing to bump from"
          elif [ "$BUMP" = "none" ]; then
            NEXT="$DECLARED"
            BASIS="./VERSION as committed"
          else
            CORE="${DECLARED%%-*}"
            IFS='.' read -r MAJOR MINOR PATCH <<EOF
          $CORE
          EOF
            case "$BUMP" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch)
                # Promoting a pre-release: the patch after 1.5.0-rc.1 is 1.5.0 itself,
                # not 1.5.1 — the final release of that version has not happened yet.
                if [ "$DECLARED" = "$CORE" ]; then PATCH=$((PATCH + 1)); fi
                ;;
              *) echo "::error::unknown bump '$BUMP'"; exit 1 ;;
            esac
            NEXT="$MAJOR.$MINOR.$PATCH"
            BASIS="$BUMP bump of $DECLARED"
          fi

          if ! printf '%s' "$NEXT" | grep -qE "$SEMVER"; then
            echo "::error::'$NEXT' is not MAJOR.MINOR.PATCH[-prerelease]"
            exit 1
          fi

          # A shipped version is immutable: partners have that exact zip.
          TAG_EXISTS=false
          if git rev-parse -q --verify "refs/tags/v$NEXT" >/dev/null; then
            if [ "$REPUBLISH" != "true" ]; then
              echo "::error::v$NEXT is already released — bump instead of overwriting it"
              exit 1
            fi
            # Republishing may rebuild a version, never redefine one — so what has to
            # be unchanged is what SHIPS, not the commit. Tooling, docs and workflow
            # edits are not in the zip and cannot affect it; a change under modules/ or
            # VERSION can.
            #
            # This matters more for a WHMCS module than for most software: the version
            # IS the upgrade trigger. A partner already on v$NEXT would never receive
            # different v$NEXT content, because WHMCS compares the number and would
            # never run _upgrade(). Two installs, same version, different code, no
            # signal to anyone. Bump instead — that is what the number is for.
            TAGGED="$(git rev-parse "refs/tags/v$NEXT^{commit}")"
            HEAD_SHA="$(git rev-parse HEAD)"
            if ! git diff --quiet "$TAGGED" "$HEAD_SHA" -- modules VERSION; then
              echo "::error::modules/ or VERSION changed since v$NEXT was tagged, so republishing would put different code under the same version. WHMCS would never run _upgrade() for partners already on v$NEXT. Bump to a new version instead."
              git diff --stat "$TAGGED" "$HEAD_SHA" -- modules VERSION
              exit 1
            fi

            # Identical payload, so the existing tag still marks a commit that builds
            # this exact zip. Leave it where it is rather than moving a shipped tag.
            TAG_EXISTS=true
            if [ "$TAGGED" = "$HEAD_SHA" ]; then
              echo "Republishing v$NEXT at $HEAD_SHA."
            else
              echo "Republishing v$NEXT: HEAD is $HEAD_SHA, but nothing under modules/ or VERSION"
              echo "has changed since $TAGGED, so the zip is identical. Tag stays put."
            fi
          fi
          # Going backwards is legitimate on a hotfix branch, but is much more often a
          # reverted bump commit, so say so rather than silently shipping it.
          if [ -n "$LATEST" ]; then
            HIGHEST="$(printf '%s\n%s\n' "${LATEST#v}" "$NEXT" | sort -V | tail -n1)"
            if [ "$HIGHEST" != "$NEXT" ]; then
              echo "::warning::$NEXT is not newer than the last tag $LATEST — releasing anyway; WHMCS will not run _upgrade() on installs already past it"
            fi
          fi

          echo "Last tagged: ${LATEST:-none}"
          echo "Releasing:   $NEXT  ($BASIS)"

          bash scripts/set-version.sh "$NEXT"

          # A pre-release version is a pre-release, whoever ticked what.
          PRE=${{ inputs.prerelease }}
          case "$NEXT" in *-*) PRE=true ;; esac

          # The asset name carries no version, deliberately: that is what makes
          # releases/latest/download/vpnhoodpartner.zip a stable link the README can
          # point straight at. The version is in the release title, in the tag, and
          # inside the zip where WHMCS reads it.
          {
            echo "version=$NEXT"
            echo "tag=v$NEXT"
            echo "asset=$MODULE.zip"
            echo "previous=$LATEST"
            echo "prerelease=$PRE"
            echo "tag_exists=$TAG_EXISTS"
          } >> "$GITHUB_OUTPUT"

      - name: Lint the PHP that ships in the zip
        run: |
          set -euo pipefail
          if ! command -v php >/dev/null 2>&1; then
            echo "::warning::no PHP on the runner — skipping the syntax check"
            exit 0
          fi
          php -v | head -n1
          find modules -name '*.php' -print0 | xargs -0 -r -n1 php -l

      - name: Commit the version bump
        env:
          TAG: ${{ steps.v.outputs.tag }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Every module already declared ${{ steps.v.outputs.version }} — nothing to commit."
            exit 0
          fi

          git add VERSION modules
          git commit -m "Release $TAG"

          # Someone may have pushed to the branch while this ran; rebase onto them
          # rather than failing the release outright.
          for attempt in 1 2 3; do
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              echo "::error::could not push the version bump to $BRANCH"
              exit 1
            fi
            echo "Push rejected — rebasing onto origin/$BRANCH and retrying."
            git fetch --quiet origin "$BRANCH"
            git rebase "origin/$BRANCH"
          done

      - name: Tag the release commit
        if: steps.v.outputs.tag_exists != 'true'
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          git tag -a "$TAG" -m "VpnHood! Partner Connector $TAG"
          git push origin "refs/tags/$TAG"

      - name: Build the partner zip
        env:
          ASSET: ${{ steps.v.outputs.asset }}
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/pkg"
          rm -rf "$STAGE" && mkdir -p "$STAGE"

          # The zip holds ONLY `modules/`, because a partner extracts it
          # at the root of their WHMCS install: every path in it is one they are agreeing
          # to merge in. Repo-only material (docs/, scripts/, tests/, .github/) is absent.
          cp -R modules "$STAGE/modules"

          # LGPL: the licence travels with the code we distribute, inside each module.
          cp LICENSE "$STAGE/modules/servers/vpnhoodpartner/LICENSE"
          cp LICENSE "$STAGE/modules/addons/vpnhoodpartnerconfig/LICENSE"

          find "$STAGE" \( -name '*.bak' -o -name '.DS_Store' -o -name 'Thumbs.db' \) -delete

          # zip records each file's mtime, and a fresh checkout stamps those with the
          # time the runner cloned — so without this, rebuilding identical content
          # produces a different archive every single run. Date everything from the last
          # commit that touched what actually ships, which means a rebuild that changed
          # only docs or tooling still reproduces the same bytes. That is exactly the
          # condition `republish` allows, so this is what makes its promise true.
          SOURCE_DATE="$(git log -1 --format=%cI -- modules VERSION)"
          [ -n "$SOURCE_DATE" ] || { echo "::error::could not date modules/"; exit 1; }
          echo "Payload last changed $SOURCE_DATE — stamping the archive with it."
          find "$STAGE" -exec touch -d "$SOURCE_DATE" {} +

          # Sorted input + -X (no uid/gid/extra attrs) does the rest: same payload in,
          # same checksum out.
          ( cd "$STAGE" && find modules | LC_ALL=C sort | zip -q -X "$GITHUB_WORKSPACE/$ASSET" -@ )

          sha256sum "$ASSET" > "$ASSET.sha256"
          ls -lh "$ASSET"

      - name: Verify the zip
        env:
          VERSION: ${{ steps.v.outputs.version }}
          ASSET: ${{ steps.v.outputs.asset }}
        run: |
          set -euo pipefail
          unzip -Z1 "$ASSET"

          # Everything WHMCS needs must be in there, at the path it will be extracted to.
          for f in \
            modules/servers/vpnhoodpartner/vpnhoodpartner.php \
            modules/servers/vpnhoodpartner/whmcs.json \
            modules/servers/vpnhoodpartner/lib/HubClient.php \
            modules/servers/vpnhoodpartner/templates/clientarea.tpl \
            modules/servers/vpnhoodpartner/templates/error.tpl \
            modules/addons/vpnhoodpartnerconfig/vpnhoodpartnerconfig.php
          do
            unzip -Z1 "$ASSET" | grep -Fxq "$f" || { echo "::error::$f missing from $ASSET"; exit 1; }
          done

          # Nothing outside modules/ may be in the archive — it lands in the WHMCS
          # root. (Tree roots are stored as entries themselves, hence `|$`.)
          if unzip -Z1 "$ASSET" | grep -vE '^modules(/|$)' | grep -q .; then
            echo "::error::$ASSET contains paths outside modules/"
            unzip -Z1 "$ASSET" | grep -vE '^modules(/|$)'
            exit 1
          fi

          # The in-app purchase module is a package of its own (VpnHood.WHMCS.Iap) and
          # must never ride along here: a partner installs it deliberately or not at all,
          # and a stale copy inside this zip would silently downgrade the addon of one
          # who installs both.
          if unzip -Z1 "$ASSET" | grep -q 'vpnhoodiap'; then
            echo "::error::$ASSET still carries vpnhoodiap files"
            unzip -Z1 "$ASSET" | grep 'vpnhoodiap'
            exit 1
          fi

          # Both halves must declare the version being tagged: the addon's number is what
          # WHMCS compares to decide whether to run _upgrade(), and the connector's is
          # what the addon page shows. A mismatch is a half-broken upgrade for a partner.
          unzip -p "$ASSET" modules/servers/vpnhoodpartner/whmcs.json \
            | grep -q "\"version\"[[:space:]]*:[[:space:]]*\"$VERSION\"" \
            || { echo "::error::whmcs.json in the zip is not at $VERSION"; exit 1; }
          unzip -p "$ASSET" modules/addons/vpnhoodpartnerconfig/vpnhoodpartnerconfig.php \
            | grep -q "'version'[[:space:]]*=>[[:space:]]*'$VERSION'" \
            || { echo "::error::vpnhoodpartnerconfig.php in the zip is not at $VERSION"; exit 1; }

          sha256sum -c "$ASSET.sha256"
          echo "$ASSET verified."

      - name: Write the release notes
        id: notes
        env:
          VERSION: ${{ steps.v.outputs.version }}
          ASSET: ${{ steps.v.outputs.asset }}
        run: |
          set -euo pipefail
          SHA="$(cut -d' ' -f1 < "$ASSET.sha256")"
          NOTES="$RUNNER_TEMP/notes.md"

          # Deliberately minimal. Install steps live in the README and are not repeated
          # here: two copies drift, and the one on the release page is the one nobody
          # remembers to update. Only what is specific to THIS build goes in.
          cat > "$NOTES" <<EOF
          **VpnHood! Partner Connector $VERSION** — the WHMCS server module (\`vpnhoodpartner\`)
          plus its configuration addon (\`vpnhoodpartnerconfig\`). In-app purchases are a
          separate package with its own release stream:
          [\`vpnhoodiap\`](https://github.com/vpnhood/VpnHood.WHMCS.Iap/releases/latest).

          \`\`\`
          sha256  $SHA
          \`\`\`
          EOF

          echo "path=$NOTES" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          ASSET: ${{ steps.v.outputs.asset }}
          NOTES: ${{ steps.notes.outputs.path }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ steps.v.outputs.prerelease }}
        run: |
          set -euo pipefail

          # Replacing, not editing: deleting first means the new release cannot inherit
          # a stale asset from the old one under a name this build no longer produces.
          # Without --cleanup-tag, so the tag we just verified stays exactly as it is.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Deleting the existing $TAG release to replace it."
            gh release delete "$TAG" --yes
          fi

          args=(
            "$TAG"
            "$ASSET"
            "$ASSET.sha256"
            # Just the tag, which is what GitHub itself defaults to. The repo sidebar
            # truncates a long release name, and the version is the one part of it that
            # has to survive — putting the product name first buries it. The product is
            # already named by the repo, and again in the first line of the body.
            --title "$TAG"
            --notes-file "$NOTES"
            --verify-tag
          )
          if [ "$DRAFT" = "true" ]; then args+=(--draft); fi
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          # A real, final release is the one partners should be pointed at.
          if [ "$DRAFT" != "true" ] && [ "$PRERELEASE" != "true" ]; then args+=(--latest); fi
          gh release create "${args[@]}"

      - name: Summarise
        env:
          TAG: ${{ steps.v.outputs.tag }}
          ASSET: ${{ steps.v.outputs.asset }}
          SHA: ${{ steps.notes.outputs.sha }}
          PREVIOUS: ${{ steps.v.outputs.previous }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "## ${{ inputs.republish && 'Republished' || 'Released' }} $TAG"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Previous release | ${PREVIOUS:-none} |"
            echo "| Asset | \`$ASSET\` |"
            echo "| sha256 | \`$SHA\` |"
            echo "| Draft | ${{ inputs.draft }} |"
            echo "| Pre-release | ${{ steps.v.outputs.prerelease }} |"
            echo
            echo "https://github.com/$REPO/releases/tag/$TAG"
          } >> "$GITHUB_STEP_SUMMARY"
